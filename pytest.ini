[pytest]
# The public ActiveArena snapshot ships the converter, chat-label, and video
# resource tests.  A few historical tests under tests/ exercise RoboCasa and
# RoboTwin examples that are intentionally not part of this release; keeping
# them out of default discovery prevents a fresh clone from failing before any
# ActiveArena test runs.  Those compatibility tests remain available through
# an explicit path when the corresponding legacy examples are restored.
python_files = test_astribot_converter.py test_chat_label_utils.py test_video_resource_cleanup.py
